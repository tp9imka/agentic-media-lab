name: Error in a record
description: A record says something its source does not support.
title: "error: <record id>"
labels: ["record-error"]
body:
  - type: input
    id: record-id
    attributes:
      label: Record id
      description: The id of the record that is wrong.
    validations:
      required: true
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What is wrong
      description: Say which field or claim is wrong and what it should say.
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Source that shows it (URL)
      description: A primary source you opened.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: Quote from that source
      description: Copy the exact words. Add a locator such as a section, line or timestamp.
      render: text
    validations:
      required: true
